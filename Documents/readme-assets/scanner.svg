<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Card scanning pipeline: capture, OCR the name, send over STOMP, ORB feature matching, ranked matches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#180e41"/>
      <stop offset="1" stop-color="#340e41"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="panel"><rect width="1000" height="400" rx="20"/></clipPath>
    <linearGradient id="pkmn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFCFD6"/>
      <stop offset="1" stop-color="#6E6E7A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="ocrBox"><rect x="222" y="210" width="156" height="40" rx="8"/></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .scan    { animation: scan 2.2s ease-in-out infinite alternate; }
    .shutter { animation: shutter 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .march   { stroke-dasharray: 6 5; animation: march 1s linear infinite; }
    .type    { animation: type 4s steps(13) infinite; }
    .caret   { animation: caret .8s steps(1) infinite; }
    .packet  { animation: packet 2s ease-in-out infinite; }
    .kp      { animation: pop 4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .match   { stroke-dasharray: 100; stroke-dashoffset: 0; animation: link 4s ease-out infinite; }
    .bar     { animation: bar 4s ease-out infinite; transform-box: fill-box; transform-origin: left center; }
    .dot     { animation: travel 7s linear infinite; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .4s; }
    .d4 { animation-delay: .55s; } .d5 { animation-delay: .7s; } .d6 { animation-delay: .85s; }
    .d7 { animation-delay: 1s; } .d8 { animation-delay: 1.15s; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; }
    @keyframes scan    { from { transform: translateY(0); } to { transform: translateY(98px); } }
    @keyframes shutter { 0%,80%,100% { transform: scale(1); } 90% { transform: scale(.8); } }
    @keyframes march   { to { stroke-dashoffset: -22; } }
    @keyframes type    { 0% { transform: translateX(-142px); } 60%,100% { transform: translateX(0); } }
    @keyframes caret   { 50% { opacity: 0; } }
    @keyframes packet  { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(118px); opacity: 0; } }
    @keyframes pop     { 0% { transform: scale(0); } 12% { transform: scale(1.4); } 18%,100% { transform: scale(1); } }
    @keyframes link    { 0%,25% { stroke-dashoffset: 100; } 55%,100% { stroke-dashoffset: 0; } }
    @keyframes bar     { 0% { transform: scaleX(0); } 45%,100% { transform: scaleX(1); } }
    @keyframes travel  { from { transform: translateX(0); } to { transform: translateX(785px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1000" height="400" fill="url(#bg)"/>
    <rect width="1000" height="400" fill="url(#grid)"/>

    <!-- 1 · Capture -->
    <rect x="45" y="36" width="120" height="240" rx="18" fill="#120a33" stroke="#A228E4" stroke-width="2"/>
    <rect x="53" y="54" width="104" height="204" rx="7" fill="#0b0622"/>
    <rect x="88" y="43" width="34" height="5" rx="2.5" fill="#A228E4" fill-opacity="0.6"/>
    <g>
      <rect x="70" y="92" width="70" height="98" rx="5" fill="url(#pkmn)"/>
      <rect x="76" y="98" width="58" height="10" rx="2" fill="#ffffff" fill-opacity="0.55"/>
      <rect x="76" y="112" width="58" height="40" rx="3" fill="#ffffff" fill-opacity="0.3"/>
      <circle cx="105" cy="132" r="11" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="78" y="160" width="54" height="3" rx="1.5" fill="#3A1A00" fill-opacity="0.4"/>
      <rect x="78" y="168" width="40" height="3" rx="1.5" fill="#3A1A00" fill-opacity="0.4"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <path d="M64 98 v-12 h12"/><path d="M146 98 v-12 h-12"/>
      <path d="M64 184 v12 h12"/><path d="M146 184 v12 h-12"/>
    </g>
    <g class="scan">
      <rect x="66" y="78" width="78" height="14" fill="url(#beam)"/>
      <rect x="66" y="91" width="78" height="2" fill="#3DDC97"/>
    </g>
    <circle class="shutter" cx="105" cy="234" r="12" fill="#ffffff" fill-opacity="0.9" stroke="#A228E4" stroke-width="3"/>

    <!-- 2 · OCR -->
    <rect class="march" x="216" y="54" width="168" height="52" rx="8" fill="none" stroke="#FFD84D" stroke-width="2"/>
    <rect x="222" y="60" width="156" height="40" rx="5" fill="#FFD84D"/>
    <text x="234" y="87" font-size="19" font-weight="800" font-family="Georgia, 'Times New Roman', serif" fill="#3A1A00">Charizard</text>
    <text x="370" y="87" text-anchor="end" font-size="12" font-weight="700" fill="#B00020">HP</text>
    <path d="M300 112 v26 m-6 -6 l6 6 l6 -6" fill="none" stroke="#D9C8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="146" width="156" height="36" rx="8" fill="#0b0622" stroke="#C77DFF" stroke-width="1.5"/>
    <text x="300" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#E2C2FF">Tesseract OCR</text>
    <path d="M300 186 v18 m-6 -6 l6 6 l6 -6" fill="none" stroke="#D9C8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="210" width="156" height="40" rx="8" fill="#123a2c" stroke="#3DDC97" stroke-width="1.5"/>
    <g clip-path="url(#ocrBox)">
      <text x="236" y="235" class="mono" font-size="14" font-weight="700" fill="#BFFFE3">"Charizard"</text>
      <g class="type">
        <rect x="378" y="214" width="150" height="32" fill="#123a2c"/>
        <rect class="caret" x="378" y="221" width="2" height="18" fill="#3DDC97"/>
      </g>
    </g>

    <!-- 3 · Send -->
    <text x="495" y="74" text-anchor="middle" font-size="12" font-weight="600" fill="#A895C9">STOMP over WebSocket</text>
    <text x="495" y="94" text-anchor="middle" class="mono" font-size="12" fill="#7CC4FF">/ws/scanning</text>
    <rect x="424" y="114" width="142" height="40" rx="20" fill="#0b0622" stroke="#7CC4FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <g class="packet">
      <rect x="430" y="122" width="34" height="24" rx="4" fill="#7CC4FF"/>
      <path d="M430 124 l17 12 l17 -12" fill="none" stroke="#0b0622" stroke-width="2"/>
    </g>
    <path d="M572 134 h14 m-6 -6 l6 6 l-6 6" fill="none" stroke="#7CC4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="172" width="150" height="92" rx="8" fill="#0b0622" stroke="#ffffff" stroke-opacity="0.15"/>
    <g class="mono" font-size="11.5">
      <text x="432" y="192" fill="#7CC4FF" font-weight="700">SEND /app/scan</text>
      <text x="432" y="212" fill="#E6DAF7">{ imageBase64,</text>
      <text x="446" y="230" fill="#E6DAF7">cardNameOcr:</text>
      <text x="460" y="248" fill="#BFFFE3">"Charizard" }</text>
    </g>

    <!-- 4 · Match -->
    <text x="643" y="62" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#A895C9">PHOTO</text>
    <text x="737" y="62" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1" fill="#A895C9">CANDIDATE</text>
    <rect x="610" y="70" width="66" height="92" rx="5" fill="url(#gray)"/>
    <rect x="616" y="76" width="54" height="9" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="616" y="89" width="54" height="38" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="704" y="70" width="66" height="92" rx="5" fill="url(#pkmn)"/>
    <rect x="710" y="76" width="54" height="9" rx="2" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="710" y="89" width="54" height="38" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    <g stroke-width="1.5" fill="none">
      <path class="match d1" d="M624 88 L718 90" stroke="#3DDC97"/>
      <path class="match d2" d="M650 82 L744 80" stroke="#3DDC97"/>
      <path class="match d3" d="M662 100 L756 102" stroke="#3DDC97"/>
      <path class="match d4" d="M632 114 L726 112" stroke="#3DDC97"/>
      <path class="match d5" d="M656 122 L750 124" stroke="#3DDC97"/>
      <path class="match d6" d="M622 140 L716 138" stroke="#3DDC97"/>
      <path class="match d7" d="M644 148 L738 150" stroke="#3DDC97"/>
      <path class="match d8" d="M664 144 L722 96" stroke="#FF5C7A" stroke-dasharray="4 3"/>
    </g>
    <g fill="none" stroke-width="1.6">
      <circle class="kp d1" cx="624" cy="88" r="3.5" stroke="#3DDC97"/><circle class="kp d1" cx="718" cy="90" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d2" cx="650" cy="82" r="3.5" stroke="#3DDC97"/><circle class="kp d2" cx="744" cy="80" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d3" cx="662" cy="100" r="3.5" stroke="#3DDC97"/><circle class="kp d3" cx="756" cy="102" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d4" cx="632" cy="114" r="3.5" stroke="#3DDC97"/><circle class="kp d4" cx="726" cy="112" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d5" cx="656" cy="122" r="3.5" stroke="#3DDC97"/><circle class="kp d5" cx="750" cy="124" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d6" cx="622" cy="140" r="3.5" stroke="#3DDC97"/><circle class="kp d6" cx="716" cy="138" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d7" cx="644" cy="148" r="3.5" stroke="#3DDC97"/><circle class="kp d7" cx="738" cy="150" r="3.5" stroke="#3DDC97"/>
      <circle class="kp d8" cx="664" cy="144" r="3.5" stroke="#FF5C7A"/><circle class="kp d8" cx="722" cy="96" r="3.5" stroke="#FF5C7A"/>
    </g>
    <text x="690" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">ORB · 1,000 features</text>
    <text x="690" y="210" text-anchor="middle" font-size="11.5" fill="#D9C8F0">BFMatcher · Hamming · kNN k=2</text>
    <text x="690" y="230" text-anchor="middle" class="mono" font-size="11.5" fill="#3DDC97">keep if d1 &lt; 0.75·d2</text>
    <text x="690" y="250" text-anchor="middle" class="mono" font-size="11.5" fill="#D9C8F0">score = good / keypoints</text>

    <!-- 5 · Rank -->
    <rect x="802" y="46" width="178" height="226" rx="12" fill="#0b0622" fill-opacity="0.8" stroke="#3DDC97" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="814" y="68" class="mono" font-size="11" fill="#3DDC97">/topic/scan-result</text>
    <text x="814" y="90" font-size="13.5" font-weight="700" fill="#ffffff">Match found ✓</text>
    <g font-size="11.5">
      <rect x="814" y="104" width="26" height="36" rx="3" fill="url(#pkmn)"/>
      <text x="850" y="118" fill="#ffffff" font-weight="600">Charizard ex</text>
      <text x="968" y="118" text-anchor="end" fill="#3DDC97" font-weight="700">100%</text>
      <rect x="850" y="128" width="118" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect class="bar" x="850" y="128" width="118" height="7" rx="3.5" fill="#3DDC97"/>

      <rect x="814" y="156" width="26" height="36" rx="3" fill="url(#pkmn)" fill-opacity="0.8"/>
      <text x="850" y="170" fill="#E6DAF7">Charizard</text>
      <text x="968" y="170" text-anchor="end" fill="#FFD84D" font-weight="700">64%</text>
      <rect x="850" y="180" width="118" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect class="bar b2" x="850" y="180" width="76" height="7" rx="3.5" fill="#FFD84D"/>

      <rect x="814" y="208" width="26" height="36" rx="3" fill="url(#pkmn)" fill-opacity="0.6"/>
      <text x="850" y="222" fill="#E6DAF7">Charizard V</text>
      <text x="968" y="222" text-anchor="end" fill="#C77DFF" font-weight="700">27%</text>
      <rect x="850" y="232" width="118" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect class="bar b3" x="850" y="232" width="32" height="7" rx="3.5" fill="#C77DFF"/>
    </g>
    <text x="891" y="262" text-anchor="middle" font-size="10" fill="#A895C9">example output</text>

    <!-- Timeline -->
    <line x1="105" y1="300" x2="890" y2="300" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <circle class="dot" cx="105" cy="300" r="5" fill="#C77DFF"/>
    <g font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff">
      <circle cx="105" cy="300" r="13" fill="#2a1757" stroke="#A228E4" stroke-width="2"/><text x="105" y="305">1</text>
      <circle cx="300" cy="300" r="13" fill="#2a1757" stroke="#A228E4" stroke-width="2"/><text x="300" y="305">2</text>
      <circle cx="495" cy="300" r="13" fill="#2a1757" stroke="#A228E4" stroke-width="2"/><text x="495" y="305">3</text>
      <circle cx="690" cy="300" r="13" fill="#2a1757" stroke="#A228E4" stroke-width="2"/><text x="690" y="305">4</text>
      <circle cx="890" cy="300" r="13" fill="#2a1757" stroke="#A228E4" stroke-width="2"/><text x="890" y="305">5</text>
    </g>
    <g text-anchor="middle">
      <g font-size="14" font-weight="700" fill="#ffffff">
        <text x="105" y="338">Capture</text>
        <text x="300" y="338">Read the name</text>
        <text x="495" y="338">Send</text>
        <text x="690" y="338">Match</text>
        <text x="890" y="338">Rank</text>
      </g>
      <g font-size="12" fill="#A895C9">
        <text x="105" y="358">CameraX photo</text>
        <text x="105" y="375">in the Android app</text>
        <text x="300" y="358">Tesseract reads the</text>
        <text x="300" y="375">card's title strip</text>
        <text x="495" y="358">Base64 image + OCR name</text>
        <text x="495" y="375">to the Spring backend</text>
        <text x="690" y="358">Name narrows candidates,</text>
        <text x="690" y="375">ORB features decide</text>
        <text x="890" y="358">Top 5, scored against</text>
        <text x="890" y="375">the best match</text>
      </g>
    </g>
  </g>
</svg>
