<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-label="NerdMarket architecture: Android client talks REST and STOMP to a Spring Boot backend backed by MySQL and three card APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#180e41"/>
      <stop offset="1" stop-color="#340e41"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="panel"><rect width="1000" height="580" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .down { stroke-dasharray: 5 6; animation: down 1s linear infinite; }
    .up   { stroke-dasharray: 5 6; animation: up 1s linear infinite; }
    .tile { animation: tile 4.8s ease-in-out infinite; }
    .tick { animation: tick 1s steps(2) infinite; }
    .t0 { animation-delay: 0.0s; }
    .t1 { animation-delay: 0.6s; }
    .t2 { animation-delay: 1.2s; }
    .t3 { animation-delay: 1.8s; }
    .t4 { animation-delay: 2.4s; }
    .t5 { animation-delay: 3.0s; }
    .t6 { animation-delay: 3.6s; }
    .t7 { animation-delay: 4.2s; }
    @keyframes down { to { stroke-dashoffset: -22; } }
    @keyframes up   { to { stroke-dashoffset: 22; } }
    @keyframes tile { 0%,20%,100% { fill-opacity: .04; stroke-opacity: .45; } 8% { fill-opacity: .14; stroke-opacity: 1; } }
    @keyframes tick { 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1000" height="580" fill="url(#bg)"/>
    <rect width="1000" height="580" fill="url(#grid)"/>

    <!-- Android client -->
    <rect x="30" y="24" width="940" height="100" rx="14" fill="#0b0622" fill-opacity="0.6" stroke="#A228E4" stroke-width="2"/>
    <text x="50" y="54" font-size="16" font-weight="800" fill="#ffffff">Android client</text>
    <text x="950" y="54" text-anchor="end" font-size="12" fill="#A895C9">Java · Volley · CameraX · Tesseract OCR · STOMP client</text>
    <g font-size="11.5" font-weight="600" fill="#E2C2FF">
      <rect x="72" y="84" width="104" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="124" y="101" text-anchor="middle">Login / Signup</text><rect x="182" y="84" width="85" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="224" y="101" text-anchor="middle">Card Search</text><rect x="272" y="84" width="85" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="315" y="101" text-anchor="middle">Camera Scan</text><rect x="364" y="84" width="54" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="390" y="101" text-anchor="middle">Binder</text><rect x="424" y="84" width="104" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="476" y="101" text-anchor="middle">Biggest Movers</text><rect x="534" y="84" width="92" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="580" y="101" text-anchor="middle">Price Editor</text><rect x="632" y="84" width="73" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="668" y="101" text-anchor="middle">Live Chat</text><rect x="710" y="84" width="98" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="760" y="101" text-anchor="middle">Notifications</text><rect x="814" y="84" width="60" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="844" y="101" text-anchor="middle">Profile</text><rect x="880" y="84" width="48" height="26" rx="13" fill="#A228E4" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.5"/><text x="904" y="101" text-anchor="middle">Admin</text>
    </g>

    <!-- Transports -->
    <g fill="none" stroke-width="2.5">
      <path class="down" d="M250 126 V210" stroke="#C77DFF"/>
      <path class="up"   d="M290 126 V210" stroke="#C77DFF"/>
      <path class="down" d="M710 126 V210" stroke="#7CC4FF"/>
      <path class="up"   d="M750 126 V210" stroke="#7CC4FF"/>
    </g>
    <rect x="304" y="152" width="180" height="32" rx="16" fill="#0b0622" stroke="#C77DFF" stroke-opacity="0.7"/>
    <text x="394" y="173" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E2C2FF">REST · JSON over HTTP</text>
    <rect x="516" y="152" width="180" height="32" rx="16" fill="#0b0622" stroke="#7CC4FF" stroke-opacity="0.7"/>
    <text x="606" y="173" text-anchor="middle" font-size="12.5" font-weight="700" fill="#BFE3FF">STOMP over WebSocket</text>

    <!-- Spring Boot -->
    <rect x="30" y="212" width="940" height="236" rx="14" fill="#0b0622" fill-opacity="0.6" stroke="#3DDC97" stroke-opacity="0.8" stroke-width="2"/>
    <text x="50" y="242" font-size="16" font-weight="800" fill="#ffffff">Spring Boot 4 backend <tspan font-size="12" font-weight="400" fill="#A895C9">· Java 21 · Maven</tspan></text>
    <circle class="tick" cx="698" cy="238" r="4" fill="#FFD84D"/>
    <text x="950" y="242" text-anchor="end" font-size="12" fill="#FFE58A">@Scheduled · every 60 s · daily 08:00</text>
    <g>
      <rect class="tile t0" x="54" y="262" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#C77DFF" stroke-width="1.5"/>
      <text x="68" y="286" class="mono" font-size="12" fill="#C77DFF">users/</text>
      <text x="68" y="308" font-size="14" font-weight="700" fill="#ffffff">Accounts &amp; auth</text>
      <text x="68" y="328" font-size="11.5" fill="#A895C9">BCrypt · lock after 3 bad logins</text>
    </g>
    <g>
      <rect class="tile t1" x="280" y="262" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#C77DFF" stroke-width="1.5"/>
      <text x="294" y="286" class="mono" font-size="12" fill="#C77DFF">admin/</text>
      <text x="294" y="308" font-size="14" font-weight="700" fill="#ffffff">Moderation</text>
      <text x="294" y="328" font-size="11.5" fill="#A895C9">promote · deactivate · unlock</text>
    </g>
    <g>
      <rect class="tile t2" x="506" y="262" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#C77DFF" stroke-width="1.5"/>
      <text x="520" y="286" class="mono" font-size="12" fill="#C77DFF">market/</text>
      <text x="520" y="308" font-size="14" font-weight="700" fill="#ffffff">Card catalog</text>
      <text x="520" y="328" font-size="11.5" fill="#A895C9">3 APIs → one table · search</text>
    </g>
    <g>
      <rect class="tile t3" x="732" y="262" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#C77DFF" stroke-width="1.5"/>
      <text x="746" y="286" class="mono" font-size="12" fill="#C77DFF">binders/</text>
      <text x="746" y="308" font-size="14" font-weight="700" fill="#ffffff">Collections</text>
      <text x="746" y="328" font-size="11.5" fill="#A895C9">per-user saved cards</text>
    </g>
    <g>
      <rect class="tile t4" x="54" y="354" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#C77DFF" stroke-width="1.5"/>
      <text x="68" y="378" class="mono" font-size="12" fill="#C77DFF">prices/</text>
      <text x="68" y="400" font-size="14" font-weight="700" fill="#ffffff">Price history</text>
      <text x="68" y="420" font-size="11.5" fill="#A895C9">biggest movers · 2/7/21 days</text>
    </g>
    <g>
      <rect class="tile t5" x="280" y="354" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#7CC4FF" stroke-width="1.5"/>
      <text x="294" y="378" class="mono" font-size="12" fill="#7CC4FF">notifications/</text>
      <text x="294" y="400" font-size="14" font-weight="700" fill="#ffffff">Alerts</text>
      <text x="294" y="420" font-size="11.5" fill="#A895C9">scheduled + daily price checks</text>
      <rect x="450" y="365" width="32" height="18" rx="9" fill="#7CC4FF" fill-opacity="0.18"/>
      <text x="466" y="378" text-anchor="middle" font-size="10" font-weight="800" fill="#7CC4FF">WS</text>
    </g>
    <g>
      <rect class="tile t6" x="506" y="354" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#7CC4FF" stroke-width="1.5"/>
      <text x="520" y="378" class="mono" font-size="12" fill="#7CC4FF">chat/</text>
      <text x="520" y="400" font-size="14" font-weight="700" fill="#ffffff">Live chat</text>
      <text x="520" y="420" font-size="11.5" fill="#A895C9">rooms · messages · history</text>
      <rect x="676" y="365" width="32" height="18" rx="9" fill="#7CC4FF" fill-opacity="0.18"/>
      <text x="692" y="378" text-anchor="middle" font-size="10" font-weight="800" fill="#7CC4FF">WS</text>
    </g>
    <g>
      <rect class="tile t7" x="732" y="354" width="214" height="80" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#7CC4FF" stroke-width="1.5"/>
      <text x="746" y="378" class="mono" font-size="12" fill="#7CC4FF">scanning/</text>
      <text x="746" y="400" font-size="14" font-weight="700" fill="#ffffff">Card scanner</text>
      <text x="746" y="420" font-size="11.5" fill="#A895C9">OpenCV ORB · descriptor cache</text>
      <rect x="902" y="365" width="32" height="18" rx="9" fill="#7CC4FF" fill-opacity="0.18"/>
      <text x="918" y="378" text-anchor="middle" font-size="10" font-weight="800" fill="#7CC4FF">WS</text>
    </g>

    <!-- Data + external -->
    <g fill="none" stroke-width="2.5">
      <path class="down" d="M265 450 V490" stroke="#3DDC97"/>
      <path class="up"   d="M735 450 V490" stroke="#FFD84D"/>
    </g>
    <g transform="translate(60 488)">
      <path d="M0 12 v52 a205 12 0 0 0 410 0 v-52" fill="#0b0622" stroke="#3DDC97" stroke-opacity="0.8" stroke-width="2"/>
      <ellipse cx="205" cy="12" rx="205" ry="12" fill="#123a2c" stroke="#3DDC97" stroke-width="2"/>
      <text x="205" y="40" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MySQL</text>
      <text x="205" y="58" text-anchor="middle" font-size="11.5" fill="#A895C9">Spring Data JPA · Hibernate · ddl-auto=update</text>
    </g>
    <rect x="530" y="490" width="410" height="72" rx="12" fill="#0b0622" stroke="#FFD84D" stroke-opacity="0.7" stroke-width="2"/>
    <text x="735" y="519" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">External card APIs</text>
    <text x="735" y="543" text-anchor="middle" font-size="12" fill="#FFE58A">TCGdex · Scryfall · YGOPRODeck</text>
  </g>
</svg>
