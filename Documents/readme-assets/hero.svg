<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="NerdMarket: the stock market for trading cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#180e41"/>
      <stop offset="1" stop-color="#340e41"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A228E4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A228E4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="panel"><rect width="1000" height="380" rx="20"/></clipPath>
    <linearGradient id="glint" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pkmn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="mtg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4636"/>
      <stop offset="1" stop-color="#1E1712"/>
    </linearGradient>
    <linearGradient id="ygo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A3E"/>
      <stop offset="1" stop-color="#5A3410"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#9BFFD1"/>
    </linearGradient>
    <clipPath id="lenses">
      <circle cx="471" cy="800" r="289"/>
      <circle cx="1253" cy="633" r="289"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bob     { animation: bob 5s ease-in-out infinite; }
    .glint   { animation: glint 4.5s ease-in-out infinite; }
    .float1  { animation: float 4s ease-in-out infinite; }
    .float2  { animation: float 4s ease-in-out -1.3s infinite; }
    .float3  { animation: float 4s ease-in-out -2.6s infinite; }
    .spark   { stroke-dasharray: 520; stroke-dashoffset: 0; animation: draw 6s ease-out infinite; }
    .head    { animation: pulse 1.6s ease-in-out infinite; }
    .ticker  { animation: scroll 32s linear infinite; }
    .chip    { animation: fadeUp .9s ease-out both; }
    .chip2   { animation-delay: .15s; }
    .chip3   { animation-delay: .3s; }
    .blob    { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes glint  { 0%,55% { transform: translateX(0); } 100% { transform: translateX(2600px); } }
    @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes draw   { 0% { stroke-dashoffset: 520; } 45%,100% { stroke-dashoffset: 0; } }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1680px); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift  { from { transform: translate(0,0); } to { transform: translate(-60px,30px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1000" height="380" fill="url(#bg)"/>
    <rect width="1000" height="380" fill="url(#grid)"/>
    <circle class="blob" cx="830" cy="110" r="230" fill="url(#glowA)"/>
    <circle cx="140" cy="300" r="200" fill="url(#glowB)"/>

    <!-- Logo (recreation of nerdmarket_logo.png) -->
    <g transform="translate(64 78) scale(0.088)">
      <g class="bob">
        <rect x="207" y="107" width="1346" height="1645" fill="#A228E4"/>
        <rect x="259" y="165" width="1243" height="815" fill="#BD98D2"/>
        <polygon points="38,610 395,475 1218,297 1580,250 1552,490 930,715 798,745 140,830" fill="#4F1A69"/>
        <circle cx="471" cy="800" r="332" fill="#4F1A69"/>
        <circle cx="471" cy="800" r="289" fill="#EFE0EF"/>
        <circle cx="1253" cy="633" r="333" fill="#4F1A69"/>
        <circle cx="1253" cy="633" r="289" fill="#EFE0EF"/>
        <g clip-path="url(#lenses)">
          <g transform="skewX(-22)">
            <rect class="glint" x="-700" y="150" width="260" height="1200" fill="url(#glint)"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Title -->
    <text x="252" y="148" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1">Nerd<tspan fill="#C77DFF">Market</tspan></text>
    <text x="255" y="188" font-size="22" fill="#D9C8F0">The stock market for trading cards.</text>

    <g font-size="14" font-weight="600">
      <g class="chip">
        <rect x="255" y="208" width="96" height="30" rx="15" fill="#FFD84D" fill-opacity="0.14" stroke="#FFD84D" stroke-opacity="0.6"/>
        <text x="303" y="228" text-anchor="middle" fill="#FFE58A">Pokémon</text>
      </g>
      <g class="chip chip2">
        <rect x="361" y="208" width="186" height="30" rx="15" fill="#E8A87C" fill-opacity="0.14" stroke="#E8A87C" stroke-opacity="0.6"/>
        <text x="454" y="228" text-anchor="middle" fill="#F5C9A8">Magic: The Gathering</text>
      </g>
      <g class="chip chip3">
        <rect x="557" y="208" width="104" height="30" rx="15" fill="#C77DFF" fill-opacity="0.16" stroke="#C77DFF" stroke-opacity="0.7"/>
        <text x="609" y="228" text-anchor="middle" fill="#E2C2FF">Yu-Gi-Oh!</text>
      </g>
    </g>
    <text x="255" y="270" font-size="14" fill="#A895C9">Live prices · binders · OpenCV card scanning · real-time chat · price alerts</text>

    <!-- Sparkline behind the cards -->
    <path class="spark" d="M640 292 L680 280 L712 286 L746 258 L778 266 L808 232 L840 240 L872 196 L904 206 L936 160 L980 118"
          fill="none" stroke="url(#spark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="head" cx="980" cy="118" r="5" fill="#9BFFD1"/>

    <!-- Fanned cards -->
    <g transform="translate(735 170) rotate(-13)">
      <g class="float1">
        <rect x="-55" y="-77" width="110" height="154" rx="9" fill="url(#pkmn)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="-45" y="-64" width="90" height="62" rx="4" fill="#ffffff" fill-opacity="0.25"/>
        <circle cx="0" cy="-33" r="18" fill="#ffffff" fill-opacity="0.85"/>
        <path d="M-18 -33 H18" stroke="#E8590C" stroke-width="4"/>
        <circle cx="0" cy="-33" r="6" fill="#ffffff" stroke="#E8590C" stroke-width="3"/>
        <text x="0" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#3A1A00">POKÉMON</text>
        <rect x="-36" y="26" width="72" height="4" rx="2" fill="#3A1A00" fill-opacity="0.35"/>
        <rect x="-26" y="35" width="52" height="4" rx="2" fill="#3A1A00" fill-opacity="0.35"/>
        <rect x="-42" y="50" width="84" height="18" rx="9" fill="#0f0830" fill-opacity="0.8"/>
        <text x="0" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#3DDC97">▲ 4.2%</text>
      </g>
    </g>
    <g transform="translate(905 160) rotate(13)">
      <g class="float3">
        <rect x="-55" y="-77" width="110" height="154" rx="9" fill="url(#ygo)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="-45" y="-64" width="90" height="62" rx="4" fill="#ffffff" fill-opacity="0.18"/>
        <path d="M0 -58 L22 -33 L0 -8 L-22 -33 Z" fill="#FFD84D" fill-opacity="0.85"/>
        <circle cx="0" cy="-33" r="7" fill="#5A3410"/>
        <text x="0" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#FFF0D6">YU-GI-OH!</text>
        <rect x="-36" y="26" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="-26" y="35" width="52" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="-42" y="50" width="84" height="18" rx="9" fill="#0f0830" fill-opacity="0.8"/>
        <text x="0" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#FF5C7A">▼ 1.8%</text>
      </g>
    </g>
    <g transform="translate(820 150)">
      <g class="float2">
        <rect x="-55" y="-77" width="110" height="154" rx="9" fill="url(#mtg)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
        <rect x="-45" y="-64" width="90" height="62" rx="4" fill="#E8A87C" fill-opacity="0.25"/>
        <circle cx="0" cy="-33" r="20" fill="none" stroke="#F5C9A8" stroke-width="3"/>
        <path d="M0 -50 L5 -36 L19 -33 L5 -29 L0 -15 L-5 -29 L-19 -33 L-5 -36 Z" fill="#F5C9A8"/>
        <text x="0" y="16" text-anchor="middle" font-size="10" font-weight="800" fill="#F5E6D8">MAGIC</text>
        <rect x="-36" y="26" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="-26" y="35" width="52" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="-42" y="50" width="84" height="18" rx="9" fill="#0f0830" fill-opacity="0.85"/>
        <text x="0" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#3DDC97">▲ 12.6%</text>
      </g>
    </g>

    <!-- Ticker tape -->
    <rect y="322" width="1000" height="58" fill="#0b0622" fill-opacity="0.75"/>
    <rect y="322" width="1000" height="1" fill="#A228E4" fill-opacity="0.6"/>
    <g class="ticker" font-size="13" font-weight="700" letter-spacing="2">
      <g id="tape">
        <text x="20"   y="356" fill="#3DDC97">▲ <tspan fill="#E6DAF7">LIVE PRICE TRACKING</tspan></text>
        <text x="260"  y="356" fill="#FFD84D">◆ <tspan fill="#E6DAF7">90,000+ CARDS</tspan></text>
        <text x="500"  y="356" fill="#C77DFF">◎ <tspan fill="#E6DAF7">OPENCV CARD SCANNING</tspan></text>
        <text x="740"  y="356" fill="#7CC4FF">● <tspan fill="#E6DAF7">REAL-TIME CHAT</tspan></text>
        <text x="980"  y="356" fill="#FF5C7A">▼ <tspan fill="#E6DAF7">PRICE ALERTS</tspan></text>
        <text x="1220" y="356" fill="#FFD84D">■ <tspan fill="#E6DAF7">PERSONAL BINDERS</tspan></text>
        <text x="1460" y="356" fill="#3DDC97">▶ <tspan fill="#E6DAF7">CI/CD TO PROD</tspan></text>
      </g>
      <use href="#tape" x="1680"/>
    </g>
  </g>
</svg>
